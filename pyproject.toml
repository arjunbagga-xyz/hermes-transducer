[build-system]
requires = ["setuptools>=68.0,<76.0", "wheel>=0.41,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-transducer"
version = "0.1.0"
description = "Near-ultrasonic FMCW sonar, FFT vibrometer and thermodynamic TRNG for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arjun Bagga"}]
requires-python = ">=3.10,<3.16"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "pydantic>=2.5,<3.0",
    "fastapi>=0.109,<1.0"
]

[tool.setuptools]
py-modules = []
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
